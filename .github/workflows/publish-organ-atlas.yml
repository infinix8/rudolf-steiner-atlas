name: Publish Rudolf Steiner Atlas (selective automatic release)

# Publish only changed website assets and the research data bundled into Pages.
# Docs-only, test-only and research manuscript commits do not deploy.
# The manual Run workflow button remains available for exceptional releases.
# Important: commits containing [skip ci] also skip push-triggered publication.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'atlas/**'
      - 'research/*.json'
      - 'taxonomy/**'
      - 'assets/**'
      - '.github/workflows/publish-organ-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: rudolf-steiner-atlas-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Atlas
        uses: actions/checkout@v4

      - name: Assemble thematic, organ, and evidence views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/atlas dist/research dist/taxonomy dist/docs dist/assets
          cp site/index.html dist/index.html
          cp -R atlas/. dist/atlas/
          cp research/*.json dist/research/
          cp -R taxonomy/. dist/taxonomy/
          cp docs/*.md dist/docs/
          cp -R assets/. dist/assets/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/atlas/journey.html
          test -s dist/atlas/journey.js
          test -s dist/atlas/journey.css
          test -s dist/atlas/explore.html
          test -s dist/atlas/explore.js
          test -s dist/atlas/explore.css
          test -s dist/atlas/index.html
          test -s dist/atlas/mobile-preview.html
          test -s dist/atlas/body.html
          test -s dist/atlas/organ-detail.html
          test -s dist/atlas/compare-organs.html
          test -s dist/atlas/organ-detail.js
          test -s dist/atlas/organ-detail.css
          # Human evolution and cosmic evolution are now first-class published views.
          test -s dist/atlas/evolution-story.html
          test -s dist/atlas/human-evolution.html
          test -s dist/atlas/cosmic-evolution.html
          test -s dist/research/human-evolution-concordance-v1.json
          test -s dist/research/human-constitution-stage-profiles-v1.json
          test -s dist/research/cosmic-conditions-v1.json
          test -s dist/research/organ-atlas-guides-v1.json
          test -s dist/research/organ-atlas-guides-v2-expansion.json
          test -s dist/research/organ-visual-comparisons-v1.json
          test -s dist/research/organ-body-map-v1.json
          test -s dist/atlas/organs.html
          test -s dist/atlas/graph.html
          test -s dist/research/organ-current.json
          test -s dist/taxonomy/taxonomy-v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/research/organ-current.json').read_text())
          base = Path('dist/research')
          for name, location in manifest['files'].items():
              target = (base / location).resolve()
              assert target.is_file(), f'Missing organ manifest dependency: {name} {location}'
          body_map = json.loads(Path('dist/research/organ-body-map-v1.json').read_text())
          assert body_map['organ_count'] == len(body_map['organs'])
          assert len({item['id'] for item in body_map['organs']}) == len(body_map['organs'])
          for item in body_map['organs']:
              assert (Path('dist/atlas') / item['route'].split('?')[0].split('#')[0]).is_file(), f"Missing organ page: {item['route']}"
          for rel in ['atlas/app.js', 'atlas/graph.js', 'atlas/organs.js', 'atlas/style.css', 'atlas/study-paths.json']:
              assert Path('dist', rel).is_file(), f'Missing Atlas asset: {rel}'
          # The published HTML embeds a snapshot of canonical research JSON for
          # direct file:// use. Fail the release when those copies drift apart.
          import re
          snapshots = [
              ('atlas/human-evolution.html', 'evolution-data', 'human-evolution-concordance-v1.json'),
              ('atlas/evolution-story.html', 'evolution-data', 'human-evolution-concordance-v1.json'),
              ('atlas/evolution-story.html', 'constitution-data', 'human-constitution-stage-profiles-v1.json'),
              ('atlas/cosmic-evolution.html', 'cosmic-data', 'cosmic-conditions-v1.json'),
          ]
          for html_path, script_id, json_file in snapshots:
              html = Path('dist', html_path).read_text(encoding='utf-8')
              match = re.search(
                  r'<script\s+id="' + re.escape(script_id) +
                  r'"\s+type="application/json">([\s\S]*?)</script>',
                  html,
              )
              assert match, f'Missing embedded {script_id} in {html_path}'
              embedded = json.loads(match.group(1))
              canonical = json.loads(Path('dist/research', json_file).read_text(encoding='utf-8'))
              assert embedded == canonical, f'Embedded data drift: {html_path} vs {json_file}'
          stages = json.loads(Path('dist/research/human-evolution-concordance-v1.json').read_text())
          constitution = json.loads(Path('dist/research/human-constitution-stage-profiles-v1.json').read_text())
          cosmic = json.loads(Path('dist/research/cosmic-conditions-v1.json').read_text())
          assert len(stages['stages']) == 21 and len(stages['oracles']) == 7
          assert len(constitution['profiles']) == 21 and len(cosmic['conditions']) == 7
          assert {s['id'] for s in stages['stages']} == {p['id'] for p in constitution['profiles']}
          print('Published Atlas dependencies and human/cosmic snapshots validated')
          PY
          python3 tools/validate_visual_organ_atlas.py
          # Anatomy art is non-critical to a site release: the HTML has a live
          # Wikimedia fallback if downloading the CC BY 4.0 illustration fails.
          # The original DBCLS archive URL from earlier versions did not host
          # the 2024 artwork; prefer the verified Wikimedia Commons file URL.
          mkdir -p dist/atlas/media
          art='dist/atlas/media/dbcls-human-anatomy-organs.svg'
          if curl --fail --location --retry 1 --connect-timeout 8 --max-time 25 --silent --show-error \
              'https://upload.wikimedia.org/wikipedia/commons/0/00/202403_human_anatomy_organs.svg' \
              -o "$art" || \
             curl --fail --location --retry 1 --connect-timeout 8 --max-time 25 --silent --show-error \
              'https://commons.wikimedia.org/wiki/Special:Redirect/file/202403_human_anatomy_organs.svg' \
              -o "$art"; then
            if python3 -c 'import pathlib,xml.etree.ElementTree as E,sys; p=pathlib.Path(sys.argv[1]); r=E.parse(p).getroot(); assert p.stat().st_size > 15000 and r.tag.endswith("svg") and not any(el.tag.endswith("script") for el in r.iter())' "$art"; then
              echo 'Licensed anatomy illustration packaged locally.'
            else
              rm -f "$art"
              echo '::warning::Anatomy illustration invalid; browser will load the verified Wikimedia original.'
            fi
          else
            rm -f "$art"
            echo '::warning::Could not cache optional anatomy SVG; browser will load the verified Wikimedia original.'
          fi
          du -sh dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload single combined website
        uses: actions/upload-pages-artifact@v4
        with:
          # A retry must not collide with an artifact from an earlier attempt.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
