name: Atlas browser smoke tests
on:
  push:
    paths:
      - 'atlas/**'
      - 'tests/**'
      - 'research/knowledge-graph-v1.json'
      - 'taxonomy/taxonomy-v1.json'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Launch local atlas
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/atlas-server.log 2>&1 &
          sleep 2
      - name: Exercise desktop and mobile flows
        run: node tests/atlas-browser-smoke.mjs
      - name: Print local server log on failure
        if: failure()
        run: cat /tmp/atlas-server.log || true
