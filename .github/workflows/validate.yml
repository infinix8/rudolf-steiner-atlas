name: Atlas integrity checks
on:
  push:
  pull_request:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check taxonomy
        run: python tools/validate_taxonomy.py
      - name: Check synchronized taxonomy exports
        run: python tools/validate_taxonomy_exports.py
      - name: Check source gateway and study paths
        run: python tools/validate_atlas.py
      - name: Check knowledge graph provenance
        run: python tools/validate_knowledge_graph.py
      - name: Check knowledge-graph coverage report
        run: python tools/report_knowledge_graph.py --check
      - name: Check subdomain evidence coverage report
        run: python tools/report_subdomain_coverage.py --check
      - name: Check original editorial dossiers
        run: python tools/validate_dossiers.py
      - name: Check conceptual source trajectories
        run: python tools/validate_trajectories.py
      - name: Validate cumulative organ evidence and phase 16 safeguards
        run: |
          python tools/validate_organ_concordance.py 24
          python tools/validate_organ_v27.py
          python tools/validate_organ_phase16.py
      - name: Check confirmed shared lecture source views
        run: python tools/validate_source_view_aliases.py
      - name: JavaScript syntax
        run: |
          node --check atlas/app.js
          node --check atlas/graph.js
          node --check atlas/sources.js
          node --check atlas/coverage.js
          node --check atlas/timeline.js
          node --check atlas/dossiers.js
          node --check atlas/trajectories.js
          node --check atlas/organs.js
          node --check atlas/agency.js
